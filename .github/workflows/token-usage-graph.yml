name: Token Usage Graph

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
      - name: Restore S3 client dependencies
        id: s3-cache
        uses: actions/cache/restore@v4
        with:
          path: tousage/node_modules
          key: tousage-npm-prod-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('tousage/package.json', 'tousage/package-lock.json') }}
      - name: Install S3 client
        if: ${{ steps.s3-cache.outputs.cache-hit != 'true' }}
        run: npm install --prefix tousage --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Save S3 client dependencies
        if: ${{ steps.s3-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: tousage/node_modules
          key: ${{ steps.s3-cache.outputs.cache-primary-key }}
      - name: Generate 3D contribution graph from S3
        id: graph
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
          USAGE_PASSPHRASE: ${{ secrets.USAGE_PASSPHRASE }}
        run: |
          publish_dir="$(mktemp -d "$RUNNER_TEMP/token-usage.XXXXXX")"
          node tousage/generate-usage-graph.mjs --s3 --output "$publish_dir/tousage/token-usgae-graph.svg"
          printf 'publish_dir=%s\n' "$publish_dir" >> "$GITHUB_OUTPUT"
      - name: Publish graph
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ${{ steps.graph.outputs.publish_dir }}
          keep_files: true
